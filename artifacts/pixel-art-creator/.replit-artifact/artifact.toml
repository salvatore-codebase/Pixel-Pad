kind = "web"
previewPath = "/"
title = "Pixel Art Creator"
version = "1.0.0"
id = "artifacts/pixel-art-creator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24481

[services.development]
run = "pnpm --filter @workspace/pixel-art-creator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pixel-art-creator", "run", "build" ]
publicDir = "artifacts/pixel-art-creator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24481"
BASE_PATH = "/"
